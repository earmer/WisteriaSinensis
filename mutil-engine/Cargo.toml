[package]
name = "mutil-engine"
version = "0.0.1"
edition = "2024"
rust-version = "1.88"
description = "Headless multilingual typesetting and interactive layout engine"
license = "GPL-3.0-or-later"
publish = false

[dependencies]
bitflags = "2"
harfrust = { version = "0.16.0", default-features = false, features = ["std", "icu"] }
icu_normalizer = "2.4.0"
icu_properties = "2.4.0"
icu_segmenter = "2.4.0"
read-fonts = "0.47.0"
smallvec = "1"

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[dev-dependencies]
proptest = { version = "1.7", default-features = false, features = ["std"] }
stats_alloc = "0.1.10"

[[bench]]
name = "validation_scaling"
harness = false
