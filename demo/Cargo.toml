[package]
name = "mutil-demo"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mutil-engine = { path = "../mutil-engine" }
self_cell = "1"
skrifa = "0.50"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
